spring:
  application:
    name: AI-Code-Generation-Platform
  profiles:
    active: local
    # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/gxt
    username: root
    password: root
  session:
    store-type: redis
    timeout: 3600

  # redis
  data:
    redis:
      host: localhost
      port: 6379
      ttl: 3600

server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 3600

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.gxt.aicodegenerationplatform.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
